<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HzzMonet profile banner</title>
  <desc id="desc">A soft pink and ivory profile banner centered around the profile avatar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F1F2"/>
      <stop offset=".52" stop-color="#F3E8EC"/>
      <stop offset="1" stop-color="#E8E4EF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#FFFDFC" stop-opacity=".95"/>
      <stop offset=".72" stop-color="#FFFDFC" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F1C8D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8B66F"/>
      <stop offset=".48" stop-color="#FFF9EC"/>
      <stop offset="1" stop-color="#D6AFC4"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1C9D9"/>
      <stop offset="1" stop-color="#E8B4CE"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="600" cy="180" r="120"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="26" fill="url(#bg)" stroke="#E7D9E2"/>
  <ellipse cx="600" cy="180" rx="288" ry="180" fill="url(#halo)"/>

  <g fill="none" stroke="#C9B5C6">
    <ellipse cx="600" cy="180" rx="244" ry="106" transform="rotate(-15 600 180)" stroke-opacity=".43"/>
    <ellipse cx="600" cy="180" rx="274" ry="126" transform="rotate(15 600 180)" stroke-opacity=".24"/>
  </g>

  <circle cx="600" cy="180" r="139" fill="#FFFDFC" fill-opacity=".7"/>
  <circle cx="600" cy="180" r="130" fill="url(#ring)"/>
  <circle cx="600" cy="180" r="124" fill="#FFFDFC"/>
  <image x="480" y="60" width="240" height="240" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"
    href="https://avatars.githubusercontent.com/u/229257603?v=4"
    xlink:href="https://avatars.githubusercontent.com/u/229257603?v=4"/>

  <g fill="url(#petal)" opacity=".9">
    <ellipse cx="388" cy="94" rx="12" ry="24" transform="rotate(-34 388 94)"/>
    <ellipse cx="407" cy="84" rx="11" ry="22" transform="rotate(28 407 84)"/>
    <ellipse cx="399" cy="105" rx="10" ry="18" transform="rotate(87 399 105)"/>
    <ellipse cx="808" cy="260" rx="11" ry="22" transform="rotate(32 808 260)"/>
    <ellipse cx="825" cy="249" rx="10" ry="19" transform="rotate(93 825 249)"/>
    <ellipse cx="820" cy="274" rx="9" ry="17" transform="rotate(151 820 274)"/>
  </g>
  <g fill="#D7B66F">
    <circle cx="400" cy="96" r="4"/>
    <circle cx="819" cy="261" r="4"/>
    <circle cx="335" cy="211" r="3" opacity=".75"/>
    <circle cx="866" cy="138" r="3" opacity=".75"/>
  </g>
  <g stroke="#FFFDFC" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M303 132v18m-9-9h18"/>
    <path d="M894 205v14m-7-7h14"/>
    <path d="M479 48v12m-6-6h12"/>
    <path d="M732 314v12m-6-6h12"/>
  </g>
</svg>
